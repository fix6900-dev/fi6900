[package]
name = "fi6900"
version = "0.1.0"
description = "FI6900 on-chain memecoin index fund"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "fi6900"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1" }
anchor-spl = { version = "0.31.1" }
bytemuck = { version = "1.16", features = ["derive", "min_const_generics"] }
